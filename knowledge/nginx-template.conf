# ==============================================================================
# APEX MEDIA v2.4 — PRODUCTION NGINX SERVER CONFIGURATION TEMPLATE
# Target Path: /etc/nginx/sites-available/apex.conf
# Enable: sudo ln -s /etc/nginx/sites-available/apex.conf /etc/nginx/sites-enabled/
# ==============================================================================

# HTTP — Force redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;
    return 301 https://YOUR_DOMAIN.com$request_uri;
}

# HTTPS — Production Application Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.com;

    # Document Root — MUST strictly point to the public subdirectory
    root /var/www/apex/public;
    index index.php index.html;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy (CSP)
    # NOTE: During staging testing, verify if 'unsafe-eval' can be safely removed for your Alpine.js build.
    # Keep 'unsafe-inline' only where dynamic components require it, or migrate to nonces in a subsequent hardening phase.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net data:; img-src 'self' data: https: blob:; media-src 'self' https: blob:; connect-src 'self'; frame-ancestors 'none';" always;

    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Application Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Logging Directives for High-Frequency Assets
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Strict Denial: Deny access to hidden files and directories (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Strict Denial: Deny direct execution of PHP files inside uploaded storage directory
    location ~* ^/storage/.*\.php$ {
        deny all;
    }

    # Static Asset Caching
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|css|js|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
