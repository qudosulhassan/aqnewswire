# ==============================================================================
# APEX MEDIA v2.4 — PRODUCTION SUPERVISOR WORKER CONFIGURATION TEMPLATE
# Target Path: /etc/supervisor/conf.d/apex-worker.conf
# Apply: sudo supervisorctl reread && sudo supervisorctl update
# ==============================================================================

[program:apex-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/apex/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
directory=/var/www/apex
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/apex-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
